# This file is maintained by Tedium - manual edits will be overwritten!
name: CI
"on":
  - push
jobs:
  check-root-go:
    runs-on: ubuntu-latest
    container:
      image: docker.io/golang:1.27.1@sha256:162be5298a40ed317005c8339c6de4d10d3eef336d66dc8e9259b03ab9d3a6d2
    steps:
      - uses: markormesher/ci-resources/setup@cab6a24510515dfdc829ed2d2b1fa722a34bb00b # v0.10.0
      - env:
          CI_CACHE_TOKEN: ${{ secrets.CI_CACHE_TOKEN }}
        run: ./task -s cacheload-root-go
      - run: ./task -s deps-root-go
      - run: ./task -s lint-root-go
      - env:
          CI_CACHE_TOKEN: ${{ secrets.CI_CACHE_TOKEN }}
        run: ./task -s cachesave-root-go
  ci-all:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - check-root-go
      - img-root
    container:
      image: docker.io/busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
    steps:
      - run: |2
          results=$(echo '${{ toJson(needs) }}' | (grep '"result"' || echo))
          if echo "$results" | grep -q "failure\|cancelled\|skipped"; then
            echo "One or more jobs failed, were cancelled, or were skipped" >&2
            exit 1
          fi
          echo "All jobs passed"
  img-root:
    runs-on: ubuntu-latest
    needs:
      - check-root-go
    permissions:
      packages: write
    steps:
      - uses: markormesher/ci-resources/setup@cab6a24510515dfdc829ed2d2b1fa722a34bb00b # v0.10.0
      - run: buildah login ghcr.io -u "${{ github.actor }}" -p "${{ github.token }}"
      - run: ./task -s imgrefs-root
      - run: ./task -s imgbuild-root
      - run: ./task -s imgpush-root
